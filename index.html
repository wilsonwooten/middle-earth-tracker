<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middle-earth Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg: #1e1a16; --panel: #2a241e; --ink: #e8dcc5; --muted: #a2947c; --line: #4a4036; --accent: #d4a24c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Georgia, "Times New Roman", serif; }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  #panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  #panel header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #panel h1 { margin: 0 0 8px; font-size: 18px; font-weight: normal; letter-spacing: .04em; color: var(--accent); }
  select, button { font: inherit; background: #3a3229; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
  select { width: 100%; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #1e1a16; border-color: var(--accent); }
  #searchWrap { position: relative; margin-top: 8px; }
  #search { width: 100%; font: inherit; background: #3a3229; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  #search:focus { outline: none; border-color: var(--accent); }
  #matches { position: absolute; left: 0; right: 0; top: 100%; z-index: 50; background: #2a241e; border: 1px solid var(--accent); border-top: none; border-radius: 0 0 4px 4px; max-height: 260px; overflow: auto; display: none; }
  #matches.show { display: block; }
  .mt { display: flex; align-items: center; gap: 8px; padding: 5px 8px; cursor: pointer; }
  .mt:hover, .mt.sel { background: #3a3229; }
  .mt .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid; flex: none; overflow: hidden; background: #f3e9d2; }
  .mt .dot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mt .dot.place { background: var(--accent); border-color: #fff3; width: 12px; height: 12px; margin: 0 5px; }
  .mt .kind { margin-left: auto; color: var(--muted); font-size: 11px; }
  #result { display: none; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #241f1a; font-size: 13px; overflow: auto; flex: 0 1 auto; min-height: 74px; }
  #result.collapsed .rb { display: none; }
  .chev { cursor: pointer; color: var(--muted); font-size: 11px; padding: 2px 6px; user-select: none; }
  .chev:hover { color: var(--ink); }
  .collapsed .chev { transform: rotate(-90deg); }
  #result.show { display: block; }
  #result .rh { display: flex; align-items: center; gap: 10px; }
  #result .rh .big { width: 44px; height: 44px; border-radius: 50%; border: 3px solid; overflow: hidden; background: #f3e9d2; flex: none; }
  #result .rh .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #result .rn { color: var(--accent); font-size: 15px; }
  #result .rl { color: var(--muted); font-size: 11.5px; font-style: italic; }
  #result .rw { margin-top: 6px; }
  #result .rw b { color: var(--accent); font-weight: normal; }
  #result .chs { margin-top: 6px; max-height: 140px; overflow: auto; }
  #result .chs div { padding: 2px 0; cursor: pointer; color: var(--muted); }
  #result .chs div:hover { color: var(--ink); }
  #result .chs div.cur { color: var(--ink); }
  #result .chs span { color: var(--accent); }
  #result .chs .ev { color: var(--ink); }
  #result .chs .later { color: var(--muted); font-style: italic; }
  @font-face { font-family: "Fell"; src: url(fonts/IMFellEnglish.woff2) format("woff2"); }
  @font-face { font-family: "Fell"; font-style: italic; src: url(fonts/IMFellEnglishItalic.woff2) format("woff2"); }
  @font-face { font-family: "Fell SC"; src: url(fonts/IMFellDWPicaSC.woff2) format("woff2"); }
  .mapnames { pointer-events: none; }
  .mapnames text { font-family: "Fell", Georgia, serif; fill: #2a1d10; stroke: #e9dcbd; stroke-linejoin: round; paint-order: stroke; }
  .mapnames text.caps { font-family: "Fell SC", "Fell", Georgia, serif; }
  .mapnames text.it { font-style: italic; }
  .mapnames text.dark { fill: #0d0a08; stroke: #a9a39a; }
  .inkhl { pointer-events: none; animation: inkpulse 1.8s ease-in-out infinite; }
  body.still .inkhl { animation: none; opacity: var(--peak, 1); } /* ?still=1: frozen at peak for screenshots */
  @keyframes inkpulse { 0%, 100% { opacity: .1; } 50% { opacity: var(--peak, 1); } }
  .hlpt { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 0 0 3px #0008, 0 0 18px 6px #d4a24c99; animation: hlpulse 1.6s ease-out infinite; }
  @keyframes hlpulse { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
  .hlcore { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 6px 2px #000a; }
  .leaflet-tooltip.hllbl { background: #000d; color: var(--accent); border: 1px solid var(--accent); font: 13px Georgia, serif; padding: 2px 8px; }
  #result .trace { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  #result .trace button { font-size: 11px; padding: 2px 8px; }
  #result .close { float: right; cursor: pointer; color: var(--muted); }
  #result .close:hover { color: var(--ink); }
  #result .other { margin-top: 6px; }
  #result .other div { cursor: pointer; color: var(--muted); padding: 1px 0; }
  #result .other div:hover { color: var(--ink); }
  #soloBar, #jumpBar { display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 900; background: #000c; color: var(--ink); border: 1px solid var(--accent); border-radius: 20px; padding: 5px 14px; font-size: 13px; pointer-events: auto; white-space: nowrap; }
  #soloBar.show, #jumpBar.show { display: block; }
  #jumpBar.show ~ #soloBar { top: 44px; }
  #soloBar b, #jumpBar b { color: var(--accent); font-weight: normal; }
  #soloBar span, #jumpBar span { margin-left: 10px; cursor: pointer; color: var(--muted); }
  #soloBar span:hover, #jumpBar span:hover { color: var(--ink); }
  #result .jump { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  #result .jump button { font-size: 11px; padding: 2px 8px; }
  .char.dim { opacity: .35; }
  .char.dead > span:nth-child(2) { color: var(--muted); }
  .char.dead .where { color: #a35a4a; font-style: italic; }
  .char.following { background: #2e2620; }
  .char.following > span:nth-child(2) { color: var(--accent); }
  .char .eye { margin-left: 6px; color: var(--muted); font-size: 10px; cursor: pointer; padding: 0 2px; }
  .char .eye:hover { color: var(--ink); }
  button.solo { font-size: 11px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }
  #chapterBar { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #chapterBar .row { display: flex; gap: 6px; align-items: center; }
  #chapterBar input[type=range] { flex: 1; accent-color: var(--accent); }
  #chapterTitle { margin: 8px 0 2px; font-size: 15px; }
  #chapterNum { color: var(--muted); font-size: 12px; }
  #note { color: var(--muted); font-size: 13px; margin-top: 6px; font-style: italic; }
  #summary { font-size: 13px; margin-top: 8px; }
  #moves { font-size: 12.5px; color: var(--muted); margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--accent); }
  #chapterBar { max-height: 48vh; overflow: auto; flex: 0 1 auto; min-height: 112px; }
  #chapterHead { display: flex; align-items: center; gap: 6px; }
  #chapterHead #chapterTitle { flex: 1; }
  #chapterBar.collapsed #chapterText { display: none; }
  #card { display: none; position: fixed; z-index: 2000; width: 300px; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; box-shadow: 0 6px 24px #000c; padding: 12px; pointer-events: none; font-size: 13px; }
  #card.show { display: block; }
  #card .head { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  #card .big { width: 72px; height: 72px; border-radius: 50%; border: 3px solid; flex: none; overflow: hidden; background: #f3e9d2; color: #fff; font: bold 26px/66px Georgia, serif; text-align: center; text-shadow: 0 1px 2px #000; }
  #card .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #card .name { font-size: 16px; color: var(--accent); }
  #card .lin { color: var(--muted); font-size: 11.5px; font-style: italic; margin: 1px 0 2px; }
  #card .at { color: var(--muted); font-size: 12px; }
  #card .travel { margin-top: 6px; color: var(--muted); font-size: 12px; }
  #card .travel b { color: var(--ink); font-weight: normal; }
  #chars { flex: 1 1 0; min-height: 170px; overflow: auto; padding: 8px 16px; } /* the list gets what is left, never under 170px; the sections above shrink and scroll */
  #panel header, #tools, #credits { flex: none; }
  .char { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .char .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff3; flex: none; }
  .char .dot.img { width: 26px; height: 26px; border-width: 2px; border-style: solid; overflow: hidden; background: #f3e9d2; }
  .char .dot.img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .char.off { opacity: .4; }
  .char .where { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
  #tools { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  #credits { padding: 8px 16px 12px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
  #credits a { color: var(--muted); }
  #map { background: #14110e; }
  .cm { border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px #0009; color: #fff; font: bold 11px/22px Georgia, serif; text-align: center; width: 26px; height: 26px; text-shadow: 0 1px 2px #000; }
  .cm.img { width: 40px; height: 40px; background: #f3e9d2; border-width: 3px; overflow: hidden; }
  .cm.img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .leaflet-marker-icon:focus, .leaflet-marker-icon:focus-visible { outline: none; }
  .arw { width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 8px solid; opacity: .8; margin: 1px 0 0 1px; filter: drop-shadow(0 0 1px #000); }
  .pile { position: relative; cursor: pointer; }
  .pile .pf { position: absolute; top: 0; }
  .pile .badge { position: absolute; right: -8px; bottom: -6px; z-index: 20; background: var(--accent); color: #1e1a16; font: bold 11px/16px Georgia, serif; border-radius: 8px; padding: 0 5px; border: 1px solid #fff; }
  .tray { display: flex; gap: 10px; justify-content: center; background: #000b; border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px 4px; }
  .tray .tm { text-align: center; cursor: default; }
  .tray .nm2 { color: #fff; font: 11px Georgia, serif; white-space: nowrap; margin-top: 2px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  .stem { width: 2px; height: 10px; background: var(--accent); margin: 0 auto; }
  .nm { position: absolute; left: 50%; transform: translateX(-50%); margin-top: 2px; z-index: 5; white-space: nowrap; background: #000c; color: #fff; border: 1px solid; border-radius: 3px; padding: 0 5px; font: 11px Georgia, serif; }
  .pin { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 2px #0006; }
  .pl { background: #000a; color: #fff; border: 1px solid var(--accent); border-radius: 3px; padding: 1px 5px; font-size: 11px; white-space: nowrap; }
  .pl.unused { opacity: .55; border-color: #888; }
  .leaflet-tooltip.lbl { background: #000b; color: #fff; border: none; font: 12px Georgia, serif; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } #panel { max-height: 45vh; } }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1>Middle-earth Tracker</h1>
      <select id="book"></select>
      <div id="searchWrap">
        <input id="search" type="search" placeholder="Find a character or place..." autocomplete="off" spellcheck="false">
        <div id="matches"></div>
      </div>
    </header>
    <div id="result"></div>
    <div id="chapterBar">
      <div class="row">
        <button id="prev" title="Previous chapter (left arrow)">&lt;</button>
        <input type="range" id="slider" min="0" max="0" value="0">
        <button id="next" title="Next chapter (right arrow)">&gt;</button>
      </div>
      <select id="chapterSel" style="margin-top:8px"></select>
      <div id="chapterHead"><div id="chapterTitle"></div><span class="chev" data-sec="chapter" title="Collapse or expand">&#9660;</span></div>
      <div id="chapterText">
        <div id="chapterNum"></div>
        <div id="note"></div>
        <div id="summary"></div>
        <div id="moves"></div>
      </div>
    </div>
    <div id="card"></div>
    <div id="chars"></div>
    <div id="tools">
      <button id="toggleFit" class="on" title="Zoom to the current markers and routes whenever the chapter changes">Auto-fit</button>
      <button id="togglePaths" class="on">Paths</button>
      <button id="toggleLabels">Place labels</button>
      <button id="toggleNames" style="display:none">Map names</button>
      <button id="toggleEdit">Edit places</button>
      <button id="toggleAlt" style="display:none">Aged look</button>
      <button id="exportBtn" style="display:none">Copy places JSON</button>
      <button id="exportShapesBtn" style="display:none">Copy shapes JSON</button>
      <button id="resetBtn" style="display:none">Reset edits</button>
    </div>
    <div id="credits"></div>
  </aside>
  <div id="map"><div id="jumpBar"></div><div id="soloBar"></div></div>
</div>

<script src="data/places.js"></script>
<script src="data/shapes.js"></script>
<script src="data/shapes-svg.js"></script>
<script src="data/labels-gondor.js"></script>
<script src="data/place-events.js"></script>
<script src="data/deaths.js"></script>
<script src="data/hobbit-lotr.js"></script>
<script src="data/silmarillion.js"></script>
<script src="data/unfinished-tales.js"></script>
<script src="icons/manifest.js"></script>
<script src="data/icon-colors.js"></script>
<script src="data/summaries-hobbit-lotr.js"></script>
<script src="data/summaries-silmarillion.js"></script>
<script src="data/summaries-unfinished-tales.js"></script>
<script src="data/extra-cast.js"></script>
<script src="data/lineage.js"></script>
<script>
// Merge the second-tier cast and its notes into the base data.
for (const b of BOOKS) {
  const ex = (window.EXTRA_CAST || {})[b.id] || {}, nx = (window.EXTRA_NOTES || {})[b.id] || {};
  for (const ch of b.chapters) {
    if (ex[ch.n]) ch.where = Object.assign({}, ch.where || {}, ex[ch.n]);
    if (nx[ch.n]) { const S = (window.SUMMARIES[b.id] = window.SUMMARIES[b.id] || {}); S[ch.n] = S[ch.n] || {}; S[ch.n].who = Object.assign({}, S[ch.n].who || {}, nx[ch.n]); }
  }
}
const MAPS = {
  thirdage:  { short: "Third Age", file: "maps/third-age.jpg", w: 10000, h: 5455, credit: 'Third Age map by <a href="https://github.com/k1tesurfen/mapome">k1tesurfen (mapome)</a>, CC BY-SA 4.0, parchment render shared on r/lotr.' },
  beleriand: { short: "Beleriand", file: "maps/beleriand.jpg", alt: "maps/beleriand-aged.jpg", w: 6000, h: 4000, credit: 'Beleriand map by <a href="https://www.deviantart.com/starcave/art/Beleriand-Map-935208788">Starcave / Hope Maps</a>, CC BY-SA 3.0.' },
  shire:   { short: "Shire", file: "maps/shire.jpg", w: 4096, h: 2288, credit: "The Shire: generated with Gemini, redrawn from Christopher Tolkien's map \"A Part of the Shire\" in The Fellowship of the Ring. Layout after the original; the drawing is new." },
  valinor: { short: "Valinor", file: "maps/valinor.jpg", w: 4096, h: 2288, credit: "Valinor: generated with Gemini from a text description based on Tolkien's Ambarkanta sketch. Original drawing." },
  gondor: { short: "Gondor", file: "maps/gondor.jpg", w: 4096, h: 3300, credit: "Gondor and Mordor: terrain generated with Gemini from Christopher Tolkien's map in The Return of the King; names drawn by the app in his wording." },
  numenor:   { short: "Numenor", file: "maps/numenor.jpg", w: 4096, h: 2288, credit: "Numenor: generated with Gemini, redrawn from Shelly Shapiro's map in Unfinished Tales. Layout after the original; the drawing is new." },
};
// Character icons: drop PNGs into icons/ named per icons/CHARACTERS.tsv; ICONS is filled by icons/manifest.js.
const ICONS = (window.ICONS || {});
const PALETTE = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#bfef45","#fabed4","#469990","#dcbeff","#9A6324","#fffac8","#800000","#aaffc3","#808000","#ffd8b1","#000075","#a9a9a9","#ffe119"];

// --- state -------------------------------------------------------------
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let places = JSON.parse(JSON.stringify(PLACES));
let shapes = JSON.parse(JSON.stringify(SHAPES));
const savedShapes = store.get("shapeEdits", null);
if (savedShapes) for (const m in savedShapes) Object.assign(shapes[m] = shapes[m] || {}, savedShapes[m]);
const saved = store.get("placeEdits", null);
if (saved) for (const m in saved) Object.assign(places[m] = places[m] || {}, saved[m]);
let book = null, chIdx = 0, curMap = null, showPaths = true, showLabels = false, editMode = false;
const altOn = new Set(store.get("altMaps", []));
const hidden = new Set(store.get("hiddenChars", []));
const expanded = new Set();
let solo = null; // character name when "Follow" is on: only they are drawn
let mapJump = null; // map id while "View on the X map" is on: same chapter, other map; cleared on a chapter change
let autoFit = store.get("autoFit", true), needFit = true;

// --- map ---------------------------------------------------------------
const map = L.map("map", { crs: L.CRS.Simple, minZoom: -5, maxZoom: 3, zoomSnap: 0.25, attributionControl: false });
let overlay = null, nameLayer = null, fitZoom = 0;
let showNames = store.get("mapNames", true);
const layers = { hl: L.layerGroup().addTo(map), markers: L.layerGroup().addTo(map), paths: L.layerGroup().addTo(map), labels: L.layerGroup().addTo(map), edit: L.layerGroup().addTo(map) };
let hlName = null; // place currently highlighted
function toLL(mapId, pct) { const M = MAPS[mapId]; return L.latLng(-pct[1] / 100 * M.h, pct[0] / 100 * M.w); }
function toPct(mapId, ll) { const M = MAPS[mapId]; return [+(ll.lng / M.w * 100).toFixed(2), +(-ll.lat / M.h * 100).toFixed(2)]; }
function mapBounds() { const M = MAPS[curMap]; return L.latLngBounds([[-M.h, 0], [0, M.w]]); }
function setMap(id, force) {
  if (curMap === id && !force) return;
  const same = curMap === id;
  if (!same) { layers.hl.clearLayers(); hlName = null; }
  curMap = id;
  const M = MAPS[id], bounds = [[-M.h, 0], [0, M.w]];
  if (overlay) overlay.remove();
  overlay = L.imageOverlay(M.alt && altOn.has(id) ? M.alt : M.file, bounds).addTo(map).bringToBack();
  if (nameLayer) { nameLayer.remove(); nameLayer = null; }
  if (showNames && (window.MAP_LABELS || {})[id]) nameLayer = namesOverlay(id).addTo(map);
  document.getElementById("toggleNames").style.display = (window.MAP_LABELS || {})[id] ? "" : "none";
  document.getElementById("toggleNames").classList.toggle("on", showNames);
  if (!same) {
    // Map switch: stop any zoom animation in flight, then fit without animating so a fast
    // scrub through chapters cannot leave the new map at the old map's zoom.
    map.stop();
    map.setMaxBounds(null);
    map.fitBounds(bounds, { animate: false });
    map.setMaxBounds(L.latLngBounds(bounds).pad(0.08));
    fitZoom = map.getZoom();
    needFit = true;
    // Once the image is in, fit the view: to the highlighted place if there is one (a map jump
    // from a place result), otherwise to the markers.
    overlay.once("load", () => { if (curMap !== id) return; if (hlName) { needFit = false; render(); showPlace(hlName, allNames().places.get(hlName) || [id]); } else { needFit = true; render(); } });
  }
  document.getElementById("credits").innerHTML = M.credit;
  const b = document.getElementById("toggleAlt"); b.style.display = M.alt ? "" : "none"; b.classList.toggle("on", altOn.has(id));
}

// Map names for maps rendered without text (data/labels-*.js): one SVG overlay the size of the
// map, text in image pixels so it scales with the map like printed lettering. Curved names run
// along a path; straight ones sit at a point with an optional rotation.
const LABEL_KIND = { giant: { s: 250, ls: .5, caps: 1 }, region: { s: 100, ls: .35, caps: 1 }, range: { s: 90, ls: .3, caps: 1 },
                     area: { s: 80, ls: .25, caps: 1 }, river: { s: 60, ls: .06, it: 1 }, place: { s: 56, ls: .04 }, note: { s: 48, ls: .02, it: 1 } };
function namesOverlay(m) {
  const M = MAPS[m], W = M.w, H = M.h, esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const px = p => `${(p[0] / 100 * W).toFixed(0)},${(p[1] / 100 * H).toFixed(0)}`;
  let defs = "", body = "";
  window.MAP_LABELS[m].forEach((l, i) => {
    const K = LABEL_KIND[l.k] || LABEL_KIND.place, s = l.s || K.s, ls = l.ls != null ? l.ls : K.ls;
    const cls = [K.caps ? "caps" : "", K.it ? "it" : "", l.d ? "dark" : ""].join(" ").trim();

      for (const who of names.chars) { if (!chaptersFor(b, who).length) continue; try { showCharacter(who, true); } catch (e) { log(`showCharacter ${b.id} ${who}: ${e.message}`); } }
      // follow mode across all chapters for a few
      for (const who of names.chars.slice(0, 40)) { if (!chaptersFor(b, who).length) continue; solo = who; for (let i = 0; i < b.chapters.length; i++) { try { chIdx = i; render(); } catch (e) { log(`solo ${b.id} ${who} ${b.chapters[i].n}: ${e.message}`); break; } } }
      solo = null;
      // every place
      for (const [pl, maps] of names.places) { try { showPlace(pl, maps); } catch (e) { log(`showPlace ${b.id} ${pl}: ${e.message}`); } }
      // expand every pile at every chapter
      for (let i = 0; i < b.chapters.length; i++) { chIdx = i; render(); const pos = positionsAt(i).pos; const m = chapterMap(b.chapters[i]); const groups = {}; for (const [w, p] of Object.entries(pos)) if (p && places[m][p]) (groups[p] = groups[p] || []).push(w); for (const [pl, whos] of Object.entries(groups)) if (whos.length > 1) { expanded.add(m + "|" + pl); try { render(); } catch (e) { log(`tray ${b.id} ${b.chapters[i].n} ${pl}: ${e.message}`); } } expanded.clear(); }
      // search for each name prefix
      for (const q of ["ga", "fro", "min", "x", "the", "'", "th", "Morgoth", "Haudh"]) { try { doSearch(q); } catch (e) { log(`doSearch ${q}: ${e.message}`); } }
      // travel text and card for everyone present at every chapter
      for (let i = 0; i < b.chapters.length; i++) { chIdx = i; const pos = positionsAt(i).pos; for (const who of Object.keys(pos)) { try { travelFor(who); showCard(who, { clientX: 500, clientY: 300 }); hideCard(); } catch (e) { log(`card ${b.id} ${b.chapters[i].n} ${who}: ${e.message}`); } } }
    }
    // data sanity: every "where" value resolves on its chapter's map or is a known place on some map
    for (const b of BOOKS) for (const ch of b.chapters) { const m = ch.map || b.map; for (const [w, pl] of Object.entries(ch.where || {})) { if (!pl) continue; if (!places[m][pl]) { const anywhere = Object.values(places).some(t => t[pl]); log(`${anywhere ? "offmap" : "UNKNOWN"} ${b.id} ${ch.n} ${w} -> ${pl} (${m})`); } } for (const pl of ch.pins || []) if (!places[m][pl]) log(`pin ${b.id} ${ch.n} ${pl} not on ${m}`); }
    // summaries coverage
    for (const b of BOOKS) for (const ch of b.chapters) { const S = (window.SUMMARIES[b.id] || {})[ch.n]; if (!S || !S.summary) log(`nosummary ${b.id} ${ch.n}`); }
    // icons and lineage coverage
    for (const who of names.chars) { if (!ICONS[who]) log(`noicon ${who}`); if (!window.LINEAGE[who]) log(`nolineage ${who}`); }
  } catch (e) { log("FATAL " + e.message + " " + e.stack); }
  const el = document.createElement("pre"); el.id = "selftest"; el.textContent = `done in ${Date.now() - t0}ms, ${errs.length} findings\n` + errs.join("\n"); document.body.appendChild(el);
}, 800);
if (qs.get("q")) setTimeout(() => { searchEl.value = qs.get("q"); doSearch(qs.get("q")); if (lastMatches.length) pick(lastMatches[0]); if (qs.get("jump")) { const jb = document.querySelector("#result .jump button"); if (jb) jb.click(); } if (qs.get("zoom")) setTimeout(() => map.setZoom(fitZoom + (+qs.get("zoom")), { animate: false }), 1500); if (qs.get("follow")) { solo = qs.get("q"); render(); showCharacter(solo, true); } }, 600);
if (qs.get("card")) setTimeout(() => showCard(qs.get("card"), { clientX: 700, clientY: 300 }), 500);
if (qs.get("hover")) setTimeout(() => { const d = document.querySelector(`.tm[data-who="${qs.get("hover")}"]`); if (d) d.dispatchEvent(new MouseEvent("mouseenter", { clientX: 900, clientY: 250 })); }, 900);
</script>
</body>
